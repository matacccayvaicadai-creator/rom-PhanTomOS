name: Build PhanTomOS Final Package
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Giai phong bo nho
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Dong goi PhanTomOS (Flashable Structure)
        run: |
          echo "📦 Dang gom tat ca linh hon cua PhanTOS vao file zip..."
          mkdir -p build/META-INF/com/google/android/
          # Gom cac file quan trong ban da sua
          cp -r vendor build/ 2>/dev/null || echo "Gom vendor"
          cp -r overlay build/ 2>/dev/null || echo "Gom overlay"
          
          # Tao file thong tin ban quyen
          echo "ROM Name: PhanTOS Skull Edition" > build/info.txt
          echo "Creator: Duc Luong" >> build/info.txt
          echo "Device: Poco F5 (marble)" >> build/info.txt
          
          cd build && zip -r9 ../PhanTOS-v1.0-DucLuong-PocoF5.zip .
          echo "✅ Da dong goi xong!"

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhanTomOS-v1.0-Final
          path: "*.zip"
