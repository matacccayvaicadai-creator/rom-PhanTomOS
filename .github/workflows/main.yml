name: Build PhanTomOS
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'

      - name: Setup Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Sync Source & Build
        run: |
          git config --global user.name "Duc Luong"
          git config --global user.email "ducluong@example.com"
          mkdir ~/evo && cd ~/evo
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          ~/repo init -u https://github.com/Evolution-X/manifest -b udc --depth=1
          ~/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          . build/envsetup.sh
          lunch evolution_marble-userdebug
          m space
