name: Build PhanTomOS Flashable ROM
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Giai phong bo nho (Sieu don dep)
        run: |
          echo "🧹 Dang xoa cac file rac de lay cho cho PhanTomOS..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/lib/node_modules
          sudo apt clean
          df -h

      - name: Setup Build Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl git zip python3
          echo "✅ Cong cu da san sang!"

      - name: Mix PhanTOS Ingredients
        run: |
          echo "🧪 Dang tron hinh nen, van tay dau lau va dong ho cua Duc Luong vao ROM..."
          # Day la lenh gia lap qua trinh hop nhat code vao ROM goc
          mkdir -p out/target/product/marble/
          echo "Creating flashable zip structure..."
          sleep 5
          echo "PhanTomOS-v1.0-SkullEdition-DucLuong.zip" > out/target/product/marble/PhanTOS-v1.0-marble.zip
          echo "✅ Da dong goi xong file ROM!"

      - name: Upload ROM to Github
        uses: actions/upload-artifact@v4
        with:
          name: PhanTomOS-PocoF5-Marble
          path: out/target/product/marble/*.zip
